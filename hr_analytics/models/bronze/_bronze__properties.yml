# models/bronze/__bronze_properties.yml
# Bronze layer — generic structural tests only
# Source: staging.hr_data_raw
# Tests here: not_null on columns critical for downstream joins
# No accepted_values tests — value validation is silver's job
# No not_null on manager_id, exit_date, termination_reason — nulls are expected

version: 2

models:
  - name: bronze_hr_data_raw
    description: >
      Bronze layer view on top of staging.hr_data_raw.
      All 52 columns remain VARCHAR — no type casting here.
      No transformations — straight copy from staging.
      Generic not_null tests on columns that would break
      downstream joins and transformations if missing.

    columns:

      # -------------------------------------------------------
      # Identity
      # -------------------------------------------------------
      - name: emp_id
        description: "Employee unique identifier. Natural key. Pipeline cannot function without this."
        tests:
          - not_null
          - unique

      - name: employee_number
        description: "Sequential numeric employee identifier as VARCHAR."
        tests:
          - not_null

      - name: manager_id
        description: >
          Manager employee ID as VARCHAR.
          NULL for Level 5 employees — no not_null test here.
          ~30 NULLs expected.

      # -------------------------------------------------------
      # Personal details
      # -------------------------------------------------------
      - name: first_name
        description: "Employee first name as VARCHAR."
        tests:
          - not_null

      - name: last_name
        description: "Employee last name as VARCHAR."
        tests:
          - not_null

      - name: email
        description: "Employee work email as VARCHAR."
        tests:
          - not_null
          - unique

      # -------------------------------------------------------
      # Demographics
      # -------------------------------------------------------
      - name: age
        description: "Employee age as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: age_group
        description: "Age bracket as VARCHAR. Values: 18-25, 26-35, 36-45, 46-55, 55+"
        tests:
          - not_null

      - name: gender
        description: "Employee gender as VARCHAR."
        tests:
          - not_null

      - name: marital_status
        description: "Marital status as VARCHAR."
        tests:
          - not_null

      # -------------------------------------------------------
      # Education
      # -------------------------------------------------------
      - name: education
        description: "Education level code as VARCHAR. Values 1-5. Decoded to label in silver."
        tests:
          - not_null

      - name: education_field
        description: "Field of education as VARCHAR."
        tests:
          - not_null

      # -------------------------------------------------------
      # Organisation
      # -------------------------------------------------------
      - name: department
        description: "Employee department as VARCHAR. Critical for dim_org join in gold."
        tests:
          - not_null

      - name: job_role
        description: "Job role title as VARCHAR. Critical for dim_job_role join in gold."
        tests:
          - not_null

      - name: job_title
        description: "Specific job title as VARCHAR. More granular than job_role."
        tests:
          - not_null

      - name: job_level
        description: "Job level as VARCHAR. Values 1-5. Used with job_role for dim_job_role."
        tests:
          - not_null

      - name: business_travel
        description: "Travel frequency as VARCHAR. Values: Travel_Rarely, Travel_Frequently, Non-Travel."
        tests:
          - not_null

      - name: employment_type
        description: "Employment type as VARCHAR. Values: Full Time, Part Time, Contract."
        tests:
          - not_null

      - name: location
        description: "City where employee works as VARCHAR."
        tests:
          - not_null

      - name: cost_center
        description: "Department budget code as VARCHAR."
        tests:
          - not_null

      - name: recruitment_source
        description: "How employee was recruited as VARCHAR."
        tests:
          - not_null

      # -------------------------------------------------------
      # Dates
      # -------------------------------------------------------
      - name: join_date
        description: "Date employee joined as VARCHAR. Format DD-MM-YYYY. Critical for tenure calculation."
        tests:
          - not_null

      - name: last_promotion_date
        description: "Date of last promotion as VARCHAR. Format DD-MM-YYYY. Always populated."
        tests:
          - not_null

      - name: exit_date
        description: >
          Date employee left as VARCHAR. Format DD-MM-YYYY.
          NULL for active employees — no not_null test here.
          ~169 NULLs expected.

      - name: termination_reason
        description: >
          Reason employee left as VARCHAR.
          NULL for active employees — no not_null test here.
          ~169 NULLs expected.

      - name: snapshot_date
        description: "Snapshot period as VARCHAR. Format DD-MM-YYYY. Critical for dim_date join."
        tests:
          - not_null

      # -------------------------------------------------------
      # Flags
      # -------------------------------------------------------
      - name: attrition
        description: "Whether employee left as VARCHAR. Values: Yes, No."
        tests:
          - not_null

      - name: overtime
        description: "Whether employee works overtime as VARCHAR. Values: Yes, No."
        tests:
          - not_null

      # -------------------------------------------------------
      # Compensation
      # -------------------------------------------------------
      - name: monthly_income
        description: "Monthly income as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: salary_slab
        description: "Salary band as VARCHAR. Values: Upto 5k, 5k-10k, 10k-15k, 15k+"
        tests:
          - not_null

      - name: daily_rate
        description: "Daily rate as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: hourly_rate
        description: "Hourly rate as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: monthly_rate
        description: "Monthly rate as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: percent_salary_hike
        description: "Salary hike percentage as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: stock_option_level
        description: "Stock option level as VARCHAR. Values: 0, 1, 2, 3."
        tests:
          - not_null

      # -------------------------------------------------------
      # Performance and survey scores
      # -------------------------------------------------------
      - name: performance_rating
        description: "Performance rating as VARCHAR. Values: 3, 4 in this dataset."
        tests:
          - not_null

      - name: environment_satisfaction
        description: "Environment satisfaction score as VARCHAR. Values: 1-4."
        tests:
          - not_null

      - name: job_satisfaction
        description: "Job satisfaction score as VARCHAR. Values: 1-4."
        tests:
          - not_null

      - name: relationship_satisfaction
        description: "Relationship satisfaction score as VARCHAR. Values: 1-4."
        tests:
          - not_null

      - name: work_life_balance
        description: "Work life balance score as VARCHAR. Values: 1-4."
        tests:
          - not_null

      - name: job_involvement
        description: "Job involvement score as VARCHAR. Values: 1-4."
        tests:
          - not_null

      # -------------------------------------------------------
      # Tenure measures
      # -------------------------------------------------------
      - name: distance_from_home
        description: "Distance from home as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: num_companies_worked
        description: "Number of previous companies as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: total_working_years
        description: "Total years of work experience as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: years_at_company
        description: "Years at current company as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: years_in_current_role
        description: "Years in current role as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: years_since_last_promotion
        description: "Years since last promotion as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: years_with_curr_manager
        description: "Years with current manager as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      - name: training_times_last_year
        description: "Training sessions last year as VARCHAR. Cast to INT in silver."
        tests:
          - not_null

      # -------------------------------------------------------
      # Constant columns — no tests needed
      # -------------------------------------------------------
      - name: employee_count
        description: "Always 1. Constant column. Dropped in silver."

      - name: over_18
        description: "Always Y. Constant column. Dropped in silver."

      - name: standard_hours
        description: "Always 80. Constant column. Dropped in silver."

      # -------------------------------------------------------
      # Pipeline metadata
      # -------------------------------------------------------
      - name: _source_file_name
        description: "S3 file path injected by COPY INTO using METADATA$FILENAME."
        tests:
          - not_null

      - name: _load_timestamp
        description: "Load timestamp injected by COPY INTO using CURRENT_TIMESTAMP()."
        tests:
          - not_null