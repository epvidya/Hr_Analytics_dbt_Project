version: 2

seeds:

  - name: seed_education_level
    description: "Lookup for education level codes 1-5. Static reference — never changes."
    columns:
      - name: education_level
        tests:
          - not_null
          - unique
      - name: education_label
        tests:
          - not_null

  - name: seed_rating_scale
    description: "Shared 1-4 rating scale used by job_satisfaction, environment_satisfaction, relationship_satisfaction, work_life_balance, job_involvement, performance_rating."
    columns:
      - name: rating_value
        tests:
          - not_null
          - unique
      - name: rating_label
        tests:
          - not_null

  - name: seed_job_level
    description: "Lookup for job level codes 1-5. Maps numeric level to label."
    columns:
      - name: job_level
        tests:
          - not_null
          - unique
      - name: job_level_label
        tests:
          - not_null

  - name: seed_salary_slab
    description: "Salary band definitions with min and max income ranges."
    columns:
      - name: salary_slab
        tests:
          - not_null
          - unique

  - name: seed_stock_option_level
    description: "Lookup for stock option level codes 0-3."
    columns:
      - name: stock_option_level
        tests:
          - not_null
          - unique

  - name: seed_business_travel
    description: "Lookup for standardised business travel values."
    columns:
      - name: business_travel
        tests:
          - not_null
          - unique

  - name: seed_department
    description: "Department reference with department code."
    columns:
      - name: department
        tests:
          - not_null
          - unique

  - name: seed_education_field
    description: "Education field reference with field category."
    columns:
      - name: education_field
        tests:
          - not_null
          - unique
